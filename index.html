<title>UTHM &amp; VIVES University of Applied Sciences — partnership report</title>

<body>

<!-- ==========================================================
     EDIT EVERYTHING BETWEEN HERE AND "END OF EDITABLE CONTENT".
     Change only the text inside the "quotation marks".
     Keep the commas, braces and brackets exactly where they are.

     PHOTOS live in the  img  folder next to this file.
     A photo that is missing simply disappears — nothing breaks.
     ========================================================== -->
<script>
const DATA = {

  org: "Universiti Tun Hussein Onn Malaysia · International Office",
  title: "UTHM and VIVES",
  subtitle: "VIVES University of Applied Sciences, Belgium — partnership chronology and institutional engagement",
  meta: "September 2025 – September 2026 · Prepared by the Department of International Mobility and Student Experience · 14 September 2026",

  cover: { src: "img/june2026_mou_ceremony2.jpg", caption: "Exchange of the Memorandum of Understanding, 23 June 2026" },

  summaryHeading: "Summary",
  summary: "UTHM and VIVES University of Applied Sciences, Belgium, first met at the EAIE conference in September 2025. A UTHM delegation is at VIVES today, 14 September 2026, to sign the Memorandum of Understanding and the Inter-Institutional Agreement (IIA) under Erasmus+ KA171. One VIVES student has already completed a semester exchange and research internship at UTHM.",

  profileHeading: "Partnership",
  profile: [
    { k: "Partner institution", v: "VIVES University of Applied Sciences, Belgium" },
    { k: "Agreements",          v: [
        "Letter of Intent (2025)",
        "Memorandum of Understanding (2026)",
        "Inter-Institutional Agreement (2026) under Erasmus+ Key Action 1 — Mobility of higher education students and staff"
      ] },
    { k: "UTHM contact",        n: "Mrs Yeoh Li Cheng", r: "Head of International Mobility and Student Experience" },
    { k: "VIVES contact",       n: "Mr Evert Cottyn",   r: "Coordinator for Internationalisation, Technology" }
  ],

  chronologyHeading: "Chronology",

  chronology: [
    {
      date: "September 2025",
      event: "First connection at EAIE 2025",
      detail: "Initial contact established with VIVES at the annual conference of the European Association for International Education.",
      photo: { src: "img/EAIE2025_VIVES.jpg", caption: "Meeting VIVES at EAIE 2025" }
    },
    {
      date: "October – November 2025",
      event: "Mobility discussions and agreement groundwork",
      detail: "Discussions on mobility arrangements for a prospective student, together with preparation of the Letter of Intent and the Memorandum of Understanding."
    },
    {
      date: "December 2025 – January 2026",
      event: "Erasmus+ KA171 proposal",
      detail: "Discussion, preparation and submission of the KA171 proposal, with VIVES as applicant and UTHM as partner institution."
    },
    {
      yearMark: "2026",
      date: "January – March 2026",
      event: "Mobility and visa guidance",
      detail: "Mobility and visa discussions, and guidance provided to VIVES and to the incoming semester exchange student, Robbe Ryckeboer."
    },
    {
      date: "March – July 2026",
      event: "First VIVES student at UTHM",
      detail: "Semester exchange combined with a research internship at the Faculty of Electrical and Electronic Engineering and the Sustainable Campus Office, supervised by Assoc. Prof. Ir. Dr. Mohd Fairouz bin Mohd Yousof.",
      pair: [
        { src: "img/ROBBE_PROJECT_1.jpg", caption: "Robbe during project work at UTHM" },
        { src: "img/ROBBE_PROJECT_2.jpg", caption: "Hands-on project development during the research internship" }
      ],
      photo: { src: "img/exchange_student_hiking.jpg", caption: "Exchange students engagement activity, Gunung Lambak, 25 April 2026" }
    },
    {
      date: "22 June 2026",
      event: "Meetings with UTHM faculties",
      detail: "Mr Evert Cottyn's programme of meetings and visits, coordinated by the International Office.",
      points: [
        "Avitex — drone and UAV technology",
        "FKMP — aviation",
        "FAST — food technology",
        "FSKTM — artificial intelligence",
        "FKEE — hosted by the Dean, Assoc. Prof. Ts. Dr. Asmarashid bin Ponniran, where Robbe presented his internship work",
        "Perpustakaan Tunku Tun Aminah"
      ],
      spread: { src: "img/vives_22_june_meeting_with_fac.jpg", caption: "Meeting with UTHM faculties" },
      gallery: [
        { src: "img/vives_22_june_drone_lab.jpg",            caption: "Drone and UAV technology" },
        { src: "img/vives_22_june_drone_ptta.jpg",           caption: "Drone technology showcase" },
        { src: "img/vives_22_june_robbe_presentation.jpg",   caption: "Student presentation at FKEE" },
        { src: "img/vives_22_june_robbe_presentation_2.jpg", caption: "Session with the FKEE management" },
        { src: "img/vives_22_june_ev_lab.jpg",               caption: "EV Research Centre" },
        { src: "img/vives_22_june_innovation_lab.jpg",       caption: "Innovation Lab" },
        { src: "img/vives_22_june_innocube.jpg",             caption: "InnoCube" },
        { src: "img/vives_22_june_ptta.jpg",                 caption: "Perpustakaan Tunku Tun Aminah" }
      ]
    },
    {
      date: "23 June 2026",
      event: "MoU exchange ceremony",
      detail: "The Memorandum of Understanding was exchanged at a ceremony officiated by the Deputy Vice-Chancellor (Academic and International), Prof. Dr. Afandi bin Ahmad.",
      linkText: "UTHM News report",
      linkUrl: "https://news.uthm.edu.my/en/2026/06/uthm-establishes-partnership-with-belgian-university-through-vives-university-of-applied-sciences/",
      photo: { src: "img/june2026_mou_ceremony.jpg", caption: "UTHM and VIVES delegations after the ceremony" }
    },
    {
      date: "September 2026",
      event: "Erasmus+ KA171 approved",
      detail: "Approval of the Erasmus+ KA171 grant, enabling VIVES to invite incoming UTHM students and staff over the following three years."
    },
    {
      date: "14 September 2026",
      event: "UTHM visit to VIVES — IIA and MoU signing",
      detail: "A UTHM delegation visits VIVES. The Inter-Institutional Agreement is signed today, together with the Memorandum of Understanding, copies of which were exchanged at the June ceremony.",
      roles: [
        { k: "Signed for UTHM",  n: "Professor Ts. Dr. Mas Fawzi bin Mohd Ali", r: "Vice-Chancellor" },
        { k: "Witnessed by",     n: "Professor Dr. Afandi bin Ahmad", r: "Deputy Vice-Chancellor (Academic and International)" },
        { k: "Accompanied by",   n: "Professor Dr. Muhammad Ramlee bin Kamarudin", r: "Director of the International Office" },
        { k: "Signed for VIVES", n: "Mrs Kathy Dewitte", r: "President" },
        { k: "Witnessed by",     n: "Ms Tine Ternest", r: "Head of Global Engagement Office" },
        { k: "Accompanied by",   n: "Mr Evert Cottyn", r: "Coordinator for Internationalisation, Technology" }
      ],
      current: true
    }
  ],

  /* Leave url as "" to show an entry as "link to be added". */

  linkSections: [
    {
      heading: "Documentation",
      items: [
        { title: "UTHM establishes partnership with Belgian university through VIVES", source: "UTHM News", url: "https://news.uthm.edu.my/en/2026/06/uthm-establishes-partnership-with-belgian-university-through-vives-university-of-applied-sciences/" },
        { title: "MoU exchange ceremony", source: "Facebook · 23 Jun 2026", url: "https://www.facebook.com/share/p/19CARPB9SY/" },
        { title: "Faculty meetings, student presentation and FKEE laboratory tour", source: "Facebook · 22 Jun 2026", url: "https://www.facebook.com/share/p/1DkeCD7Q8Y/" },
        { title: "Belgian delegation at Perpustakaan Tunku Tun Aminah", source: "Facebook · 22 Jun 2026", url: "https://www.facebook.com/share/p/1J3eoYuYFW/" },
        { title: "Exchange students engagement activity — Hiking @ Kluang, Gunung Lambak", source: "Facebook · 25 Apr 2026", url: "https://www.facebook.com/share/v/18My2Baxzm/" },
        { title: "First days on campus — a VIVES exchange student at UTHM", source: "TikTok", url: "https://vt.tiktok.com/ZSq9GDpQc/" }
      ]
    },
    {
      heading: "Student record",
      items: [
        { title: "Student life at UTHM — Robbe Ryckeboer's channel", source: "YouTube", url: "https://youtube.com/@robberyckeboer" },
        { title: "Exchange and internship presentation", source: "PDF", url: "https://drive.google.com/file/d/1UA2lEQ8ueWCYusxDCtr_Ff-gIXMKv1J0/view?usp=sharing" }
      ]
    }
  ],

  footer: "Department of International Mobility and Student Experience, International Office, Universiti Tun Hussein Onn Malaysia."

};
</script>

<style>
:root{
  --navy:#102D4A;
  --navy-d:#0A2038;
  --gold:#9A7327;
  --ink:#33404E;
  --muted:#6B7885;
  --rule:#DFE5EA;
  --tint:#F4F7F9;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#E9EEF2;color:var(--ink);
  font-family:Inter,system-ui,sans-serif;font-size:15.5px;line-height:1.7;
  -webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}

.page{max-width:960px;margin:28px auto;background:#fff;
  padding:60px 72px 76px;box-shadow:0 8px 30px rgba(16,45,74,.08)}
.topline{height:5px;background:var(--navy);margin:-60px -72px 48px}

.org{font-size:12.5px;font-weight:500;color:var(--gold);margin:0 0 18px;
  letter-spacing:.01em}
h1{font-family:"Source Serif 4",Georgia,serif;font-weight:600;color:var(--navy);
  font-size:clamp(26px,3.6vw,33px);line-height:1.16;letter-spacing:-.015em;
  margin:0 0 12px;max-width:none;text-wrap:balance}
.subtitle{font-family:"Source Serif 4",Georgia,serif;font-size:clamp(17px,2.4vw,20px);
  color:var(--muted);margin:0 0 14px;max-width:46ch;line-height:1.45}
.meta{font-size:12.5px;color:var(--muted);margin:0}

figure{margin:0}
figcaption{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.5}
.cover{margin:44px -72px 0}
.cover img{width:100%;height:auto}
.cover figcaption{padding:0 72px}

section{margin-top:56px}
.sec-head{display:flex;align-items:baseline;gap:16px;
  border-bottom:1px solid var(--rule);padding-bottom:11px;margin-bottom:26px}
.sec-no{font-family:"Source Serif 4",Georgia,serif;font-size:14px;color:var(--gold)}
h2{font-family:"Source Serif 4",Georgia,serif;font-weight:600;color:var(--navy);
  font-size:clamp(21px,3.2vw,27px);margin:0}

.summary{font-family:"Source Serif 4",Georgia,serif;font-size:18.5px;
  line-height:1.65;color:#334555;margin:0;max-width:68ch}

dl.profile{margin:0}
dl.profile div{display:grid;grid-template-columns:190px 1fr;gap:24px;
  padding:14px 0;border-bottom:1px solid var(--rule)}
dl.profile div:first-child{border-top:1px solid var(--rule)}
dl.profile dt{font-size:13px;font-weight:500;color:var(--navy);margin:0}
dl.profile dd{margin:0;font-size:15px}

ol.chron{list-style:none;margin:0;padding:0}
ol.chron li.ev{display:grid;grid-template-columns:190px 1fr;gap:34px;
  position:relative;padding:0 0 38px}
ol.chron li.ev::before{content:"";position:absolute;left:190px;top:9px;bottom:0;
  width:1px;background:var(--rule)}
ol.chron li.ev:last-child::before{display:none}
.date{font-family:"Source Serif 4",Georgia,serif;font-size:14px;color:var(--gold);
  margin:0;padding-top:2px}
.body{position:relative;padding-left:26px}
.body::before{content:"";position:absolute;left:-4px;top:7px;width:9px;height:9px;
  border:2px solid var(--gold);background:#fff;border-radius:50%}
li.now .body::before{background:var(--gold)}
.event{font-family:"Source Serif 4",Georgia,serif;font-size:21px;font-weight:600;
  color:var(--navy);margin:0 0 7px;line-height:1.3}
.detail{margin:0;font-size:15px;color:#455463;max-width:62ch}
.detail a{color:var(--navy);text-decoration:underline;
  text-decoration-color:var(--gold);text-underline-offset:3px}
dl.roles{margin:14px 0 0;max-width:62ch}
dl.roles div{display:grid;grid-template-columns:150px 1fr;gap:18px;padding:5px 0}
dl.roles dt{margin:0;font-size:13px;color:var(--muted)}
dl.roles dd{margin:0;font-size:14.5px;color:#334555}
.nm{display:block;font-weight:500}
.rl{display:block;font-size:13px;color:var(--muted);margin-top:1px}
dl.roles div.gap{padding-top:14px}
dl.profile dd ul{margin:0;padding:0;list-style:none}
dl.profile dd ul li{position:relative;padding-left:18px;margin-bottom:4px}
dl.profile dd ul li::before{content:"";position:absolute;left:2px;top:11px;width:3px;
  height:3px;border-radius:50%;background:#9BA6B2}
ul.points{margin:12px 0 0;padding:0;list-style:none;max-width:62ch}
ul.points li{position:relative;padding-left:18px;font-size:14.5px;color:#455463;
  margin-bottom:5px;line-height:1.6}
ul.points li::before{content:"";position:absolute;left:2px;top:10px;width:3px;
  height:3px;border-radius:50%;background:#9BA6B2}
.shot{margin-top:18px;max-width:600px}
.shot img{width:100%;height:auto}
.shot.portrait{max-width:340px}
.spread{display:grid;grid-template-columns:1.25fr .75fr;gap:18px;margin-top:20px;align-items:start}
.spread img{width:100%;height:auto}
.spread .note{background:var(--tint);padding:26px;align-self:stretch;display:flex;
  flex-direction:column;justify-content:flex-end}
.spread .note span{font-size:12.5px;color:var(--muted);line-height:1.5}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:20px;
  align-items:start;max-width:640px}
.pair img{width:100%;height:auto}
.pair figcaption{font-size:11px;margin-top:6px}
li.now .body{border-top:2px solid var(--navy);padding-top:20px;margin-top:2px}
li.now .event{font-size:24px}
li.now{padding-top:10px}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:18px;align-items:start}
.gal img{width:100%;height:auto}
.gal figcaption{font-size:11px;margin-top:6px}
li.year{display:block;padding:14px 0 26px}
li.year span{font-family:"Source Serif 4",Georgia,serif;font-size:32px;
  font-weight:600;color:var(--rule)}

ul.links{list-style:none;margin:0;padding:0}
ul.links li{border-bottom:1px solid var(--rule)}
ul.links li:first-child{border-top:1px solid var(--rule)}
ul.links a{display:grid;grid-template-columns:1fr auto;gap:25px;align-items:baseline;
  padding:15px 2px;text-decoration:none;color:var(--navy-d)}
ul.links a:hover .t,ul.links a:focus-visible .t{text-decoration:underline;
  text-decoration-color:var(--gold);text-underline-offset:3px}
.t{font-size:15px}
.src{font-size:12px;color:var(--muted);white-space:nowrap}
.pending{padding:15px 2px;color:var(--muted);font-size:15px}
a:focus-visible{outline:2px solid var(--navy);outline-offset:3px}

footer{margin-top:64px;padding-top:18px;border-top:1px solid var(--rule);
  font-size:12px;color:var(--muted)}

@media print{
  body{background:#fff}
  .page{margin:0;max-width:none;box-shadow:none;padding:44px 52px 56px}
  .topline{margin:-44px -52px 40px}
  .cover{margin-left:-52px;margin-right:-52px}

  .cover figcaption{padding:0 52px}
  ol.chron li.ev,.spread,.gal figure,.pair figure,section{break-inside:avoid}
  .sec-head,.event{break-after:avoid}
  figure{break-inside:avoid}
  ul.links a{color:#000}
}

@media (max-width:780px){
  body{background:#fff}
  .page{margin:0;max-width:none;box-shadow:none;padding:34px 22px 56px}
  .topline{margin:-34px -22px 30px}
  .cover{margin:32px -22px 0}
  .cover img{height:auto}
  .cover figcaption{padding:0 22px}
  dl.profile div{grid-template-columns:1fr;gap:3px}
  ol.chron li.ev{grid-template-columns:1fr;gap:5px;padding-bottom:30px}
  dl.roles div{grid-template-columns:1fr;gap:1px;padding:7px 0}
  ol.chron li.ev::before{display:none}
  .body{padding-left:18px}
  .shot.portrait{max-width:260px}
  .spread{grid-template-columns:1fr}

  .spread .note{padding:20px}
  .pair{grid-template-columns:1fr;gap:14px;max-width:none}
  .gal{grid-template-columns:1fr 1fr;gap:12px}
  ul.links a{grid-template-columns:1fr;gap:2px}
}
</style>

<main class="page">
  <div class="topline"></div>
  <div id="doc"></div>
</main>

<script>
(function(){
  const el=(t,c,x)=>{const n=document.createElement(t);if(c)n.className=c;if(x)n.textContent=x;return n;};
  const fig=(p,cls,alt)=>{
    if(!p||!p.src) return null;
    const f=el("figure",cls);
    const i=document.createElement("img");
    i.src=p.src; i.alt=p.caption||alt||""; i.loading="lazy";
    i.onerror=()=>f.remove();
    i.onload=()=>{ if(i.naturalHeight>i.naturalWidth) f.classList.add("portrait"); };
    f.append(i);
    if(p.caption) f.append(el("figcaption",null,p.caption));
    return f;
  };
  const doc=document.getElementById("doc");
  let n=0;
  const head=t=>{
    n++;
    const h=el("div","sec-head");
    h.append(el("span","sec-no",String(n).padStart(2,"0")),el("h2",null,t));
    return h;
  };

  const hd=el("header");
  hd.append(el("p","org",DATA.org),el("h1",null,DATA.title),
            el("p","subtitle",DATA.subtitle),el("p","meta",DATA.meta));
  doc.append(hd);

  const cov=fig(DATA.cover,"cover"); if(cov) doc.append(cov);

  let s=el("section");
  s.append(head(DATA.summaryHeading),el("p","summary",DATA.summary));
  doc.append(s);

  s=el("section");
  s.append(head(DATA.profileHeading));
  const dl=el("dl","profile");
  const nameCell=(o)=>{const dd=el("dd");dd.append(el("span","nm",o.n),el("span","rl",o.r));return dd;};
  DATA.profile.forEach(r=>{
    const d=el("div");
    if(r.n){ d.append(el("dt",null,r.k),nameCell(r)); dl.append(d); return; }
    const dd=el("dd");
    if(Array.isArray(r.v)){
      const u=el("ul","points");
      r.v.forEach(t=>u.append(el("li",null,t)));
      u.style.margin="2px 0 0";
      dd.append(u);
    } else dd.textContent=r.v;
    d.append(el("dt",null,r.k),dd);dl.append(d);
  });
  s.append(dl); doc.append(s);

  s=el("section");
  s.append(head(DATA.chronologyHeading));
  const ol=el("ol","chron");
  DATA.chronology.forEach(c=>{
    if(c.yearMark){const y=el("li","year");y.append(el("span",null,c.yearMark));ol.append(y);}
    const li=el("li",c.current?"ev now":"ev");
    li.append(el("p","date",c.date));
    const b=el("div","body");
    b.append(el("p","event",c.event));
    const p=el("p","detail",c.detail);
    if(c.linkUrl){
      p.append(" ");
      const a=el("a",null,c.linkText||"Read more");
      a.href=c.linkUrl;a.target="_blank";a.rel="noopener";
      p.append(a,".");
    }
    b.append(p);
    if(c.points){
      const u=el("ul","points");
      c.points.forEach(t=>u.append(el("li",null,t)));
      b.append(u);
    }
    if(c.roles){
      const rl=el("dl","roles");
      c.roles.forEach((r,i)=>{
        const d=el("div",r.k==="Signed for VIVES"?"gap":null);
        const dd=el("dd"); dd.append(el("span","nm",r.n),el("span","rl",r.r));
        d.append(el("dt",null,r.k),dd); rl.append(d);
      });
      b.append(rl);
    }
    if(c.pair){
      const pr=el("div","pair");
      c.pair.forEach(p2=>{const f=fig(p2); if(f) pr.append(f);});
      b.append(pr);
    }
    const sh=fig(c.photo,"shot"); if(sh) b.append(sh);
    if(c.spread&&c.spread.src){
      const sp=el("div","spread");
      const i=document.createElement("img");
      i.src=c.spread.src; i.alt=c.spread.caption||""; i.loading="lazy";
      i.onerror=()=>sp.remove();
      const note=el("div","note");
      note.append(el("span",null,c.spread.caption||""));
      sp.append(i,note);
      b.append(sp);
    }
    if(c.gallery){
      const g=el("div","gal");
      c.gallery.forEach(p2=>{const f=fig(p2); if(f) g.append(f);});
      b.append(g);
    }
    li.append(b);
    ol.append(li);
  });
  s.append(ol); doc.append(s);

  DATA.linkSections.forEach(sec=>{
    const x=el("section");
    x.append(head(sec.heading));
    const ul=el("ul","links");
    sec.items.forEach(i=>{
      const li=el("li");
      if(i.url){
        const a=el("a");a.href=i.url;a.target="_blank";a.rel="noopener";
        a.append(el("span","t",i.title),el("span","src",i.source));
        li.append(a);
      } else li.append(el("div","pending",i.title+" — link to be added"));
      ul.append(li);
    });
    x.append(ul); doc.append(x);
  });

  doc.append(el("footer",null,DATA.footer));
})();
</script>

</body>
</html>
